{% extends 'base.html' %}
{% block title %}Editar Série{% endblock %}
{% block content %}
<section class="card form-wrap">
  <h2>Editar Série</h2>
  <form method="post" class="form">
    <input type="text" name="title" value="{{ s.title }}" required>
    <textarea name="description" rows="5">{{ s.description }}</textarea>
    <input type="url" name="cover_url" value="{{ s.cover_url }}" placeholder="URL da capa">
    <input type="url" name="external_link" value="{{ s.external_link }}" placeholder="Link externo">
    <input type="url" name="video_url" value="{{ s.video_url }}" placeholder="Link do vídeo">
    <button type="submit">Salvar alterações</button>
  </form>
</section>
{% endblock %}
