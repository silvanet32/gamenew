<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameNew Séries</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎬 GameNew Séries</h1>
    <div class="userbar">
      <span id="userStatus">Visitante</span>
      <button id="logoutBtn" class="secondary hidden">Sair</button>
    </div>
  </header>

  <main class="container">
    <section class="card" id="authSection">
      <h2>Login / Cadastro</h2>
      <p class="muted">Admin padrão: <strong>admin@gamenew.com</strong> / <strong>admin123</strong></p>
      <div class="auth-grid">
        <form id="loginForm" class="form">
          <h3>Entrar</h3>
          <input name="email" type="email" placeholder="E-mail" required />
          <input name="password" type="password" placeholder="Senha" required />
          <button type="submit">Entrar</button>
        </form>

        <form id="registerForm" class="form">
          <h3>Criar conta</h3>
          <input name="name" type="text" placeholder="Nome" required />
          <input name="email" type="email" placeholder="E-mail" required />
          <input name="password" type="password" placeholder="Senha" required />
          <button type="submit">Cadastrar</button>
        </form>
      </div>
    </section>

    <section class="card">
      <h2>Doações</h2>
      <p id="donationMessage"></p>
      <p><strong>Método:</strong> <span id="donationMethod"></span></p>
      <p><strong>Chave/Link:</strong> <code id="donationKey"></code></p>
    </section>

    <section class="card hidden" id="adminSection">
      <h2>Painel Admin</h2>
      <div class="admin-grid">
        <form id="seriesForm" class="form">
          <h3 id="seriesFormTitle">Nova série</h3>
          <input name="title" type="text" placeholder="Título" required />
          <textarea name="description" rows="5" placeholder="Descrição" required></textarea>
          <input name="cover" type="url" placeholder="URL da capa (opcional)" />
          <input name="editId" type="hidden" />
          <button type="submit">Salvar série</button>
        </form>

        <form id="donationForm" class="form">
          <h3>Editar doação</h3>
          <input name="method" type="text" placeholder="Método" required />
          <input name="key" type="text" placeholder="Chave ou link" required />
          <textarea name="message" rows="4" placeholder="Mensagem"></textarea>
          <button type="submit">Salvar doação</button>
        </form>
      </div>
    </section>

    <section class="card">
      <h2>Séries publicadas</h2>
      <div id="seriesList" class="series-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
